<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A4234" />
<title>ClassTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@500;700&family=Kalam&display=swap" rel="stylesheet" />
<style>

:root{
  --green:#0A4234;--green-2:#125743;--green-3:#1e7a5b;--mint:#e3eee7;--mint-2:#cfe2d6;
  --cream:#F5F0E6;--cream-2:#FBF8F1;--card:#FFFDF9;--ink:#15211b;--muted:#66736c;--line:#e6dece;
  --red:#c0392b;--blue:#1f3d9e;--amber:#b7791f;--amber-bg:#fbf0d9;--red-bg:#f9e3df;
  --r:22px;--shadow:0 1px 2px rgba(10,66,52,.05),0 10px 30px -12px rgba(10,66,52,.18);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
a{color:var(--green-3);font-weight:700}
h1,h2,h3{line-height:1.2;margin:0 0 .4em;letter-spacing:-.02em}
h1{font-size:clamp(1.6rem,3.5vw,2.3rem);font-weight:800}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.05rem;font-weight:700}
p{margin:0 0 .6em}
.muted{color:var(--muted)}.small{font-size:.85rem}.w100{width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.mt{margin-top:16px}.mb{margin-bottom:16px}
@media(max-width:560px){.hide-sm{display:none}}

/* logo */
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem;color:var(--green);letter-spacing:-.02em}
.badge{width:40px;height:40px;border-radius:13px;background:var(--green);color:var(--cream);display:grid;place-items:center;flex:none;box-shadow:0 6px 16px -6px rgba(10,66,52,.6)}
.logo.big{font-size:2.1rem}.logo.big .badge{width:60px;height:60px;border-radius:18px}
.logo.light{color:var(--cream)}.logo.light .badge{background:var(--cream);color:var(--green)}

/* layout */
.topbar{position:sticky;top:0;z-index:20;background:rgba(245,240,230,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{max-width:1120px;margin:auto;padding:22px 18px 130px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g2,.g3{grid-template-columns:1fr}.wrap{padding:16px 14px 130px}.card{padding:16px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:14px;padding:11px 18px;font-weight:700;font-size:.95rem;cursor:pointer;background:var(--mint);color:var(--green);transition:transform .08s,background .2s;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--mint-2)}.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--green);color:var(--cream)}.btn-primary:hover{background:var(--green-2)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}.btn-ghost:hover{background:var(--cream-2)}
.btn-cream{background:var(--cream);color:var(--green)}.btn-cream:hover{background:#fff}
.btn-oc{background:transparent;border-color:rgba(245,240,230,.45);color:var(--cream)}.btn-oc:hover{background:rgba(245,240,230,.12)}
.btn-danger{background:var(--red-bg);color:var(--red)}.btn-danger:hover{background:#f3d2cc}
.btn-sm{padding:7px 12px;font-size:.85rem;border-radius:11px}
.icon-btn{width:40px;height:40px;padding:0;border-radius:12px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--green);font-weight:700;cursor:pointer;padding:6px 0;margin-bottom:10px}

/* forms */
.lbl{display:block;font-weight:600;font-size:.85rem;margin:12px 0 6px;color:var(--muted)}
.inp{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:13px;background:var(--cream-2);outline:none}
.inp:focus{border-color:var(--green-3);box-shadow:0 0 0 3px rgba(30,122,91,.15)}
textarea.inp{min-height:90px;resize:vertical}

/* landing */
.landing{min-height:100vh;display:grid;place-items:center;padding:40px 18px;background:radial-gradient(1000px 500px at 85% -10%,#e0ece4 0,transparent 60%),radial-gradient(800px 400px at -10% 110%,#ece4d2 0,transparent 60%),var(--cream)}
.landing-in{max-width:980px;width:100%;text-align:center}
.tagline{font-size:1.15rem;color:var(--muted);margin:14px 0 40px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:20px;text-align:left}
@media(max-width:720px){.roles{grid-template-columns:1fr}}
.role-card{background:var(--card);border:1.5px solid var(--line);border-radius:26px;padding:26px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);transition:transform .2s,border-color .2s,box-shadow .2s;cursor:pointer;text-align:left}
.role-card:hover{transform:translateY(-4px);border-color:var(--green-3);box-shadow:0 20px 40px -20px rgba(10,66,52,.35)}
.role-ic{width:52px;height:52px;border-radius:16px;background:var(--mint);color:var(--green);display:grid;place-items:center}
.role-card ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;flex:1}
.role-card li{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.role-card li svg{flex:none;margin-top:3px;color:var(--green-3)}

/* banner & stats */
.banner{background:linear-gradient(135deg,var(--green),#145c46);color:var(--cream);border-radius:28px;padding:28px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;position:relative;overflow:hidden;margin-bottom:18px}
.banner:after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:rgba(245,240,230,.06)}
.banner>*{position:relative;z-index:1}
.banner p{opacity:.88}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;font-weight:700;opacity:.7!important}
.stat{cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .15s}
.stat:hover{transform:translateY(-3px)}
.stat .ic{width:42px;height:42px;border-radius:13px;background:var(--mint);color:var(--green);display:grid;place-items:center}
.stat b{font-size:1.9rem;font-weight:800;letter-spacing:-.03em;color:var(--green)}
.big-n{font-size:1.8rem;font-weight:800;color:var(--green);margin-top:6px}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li.click{cursor:pointer;border-radius:12px;padding:12px 8px}.li.click:hover{background:var(--cream-2)}
.li .grow{flex:1;min-width:0}
.ttl{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:38px;height:38px;border-radius:12px;background:var(--mint);color:var(--green);display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none}
.av.lg{width:64px;height:64px;border-radius:20px;font-size:1.3rem}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--mint);color:var(--green);white-space:nowrap}
.pill.amber,.draft{background:var(--amber-bg);color:var(--amber)}.pill.red{background:var(--red-bg);color:var(--red)}
.pill.grey{background:#eee9df;color:var(--muted)}.pill.blue{background:#e3e8f8;color:var(--blue)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.note{background:var(--mint);border-radius:16px;padding:12px 14px;font-size:.9rem;color:var(--green);display:flex;gap:10px;align-items:flex-start}
.note svg{flex:none;margin-top:2px}

/* bottom nav */
.bnav{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:var(--green);border-radius:24px;padding:7px;display:flex;gap:4px;box-shadow:0 16px 40px -12px rgba(10,66,52,.6);width:min(560px,calc(100% - 24px))}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:rgba(245,240,230,.7);font-size:.72rem;font-weight:700;padding:8px 4px;border-radius:18px;cursor:pointer}
.bnav button.on{background:var(--cream);color:var(--green)}

/* paper + handwriting */
.paper{position:relative;container-type:inline-size;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 4px rgba(0,0,0,.05),0 18px 40px -18px rgba(10,66,52,.35);border:1px solid var(--line);display:block}
.paper>img{display:block;width:100%;user-select:none;-webkit-user-drag:none}
.ln{position:absolute;transform:translateY(-100%);height:5.4cqw;line-height:5.4cqw;font-family:'Kalam',cursive;font-size:3cqw;color:var(--blue);background:transparent;border:none;outline:none;padding:0 .8cqw;margin:0;border-radius:.6cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input.ln:hover{background:rgba(31,61,158,.04)}input.ln:focus{background:rgba(31,61,158,.08)}
.anno{position:absolute;transform:translate(0,-85%) rotate(-5deg);display:flex;align-items:center;gap:.5cqw;font-family:'Caveat',cursive;font-weight:700;font-size:4.6cqw;color:var(--red);pointer-events:none;white-space:nowrap}
.ink{width:5.5cqw;height:auto;overflow:visible}
.ink path,.anno-total path{fill:none;stroke:var(--red);stroke-linecap:round;stroke-linejoin:round}
.ink path{stroke-width:4}.anno-total path{stroke-width:3}
.anno-c{position:absolute;font-family:'Caveat',cursive;font-size:3.3cqw;color:var(--red);pointer-events:none;transform:rotate(-1.5deg);white-space:nowrap;max-width:80%;overflow:hidden;text-overflow:ellipsis}
.anno-total{position:absolute;top:3.5%;right:4%;width:17cqw;height:9cqw;display:grid;place-items:center;font-family:'Caveat',cursive;font-weight:700;font-size:6cqw;color:var(--red);transform:rotate(-6deg);pointer-events:none}
.anno-total svg{position:absolute;inset:0;width:100%;height:100%}
.eline{position:absolute;transform:translateY(-100%);height:1.4cqw;border-bottom:.45cqw dashed var(--green-3);pointer-events:none}
.eline span{position:absolute;left:0;bottom:1.2cqw;background:var(--green);color:var(--cream);font-size:2cqw;font-weight:700;padding:.2cqw 1cqw;border-radius:1cqw;pointer-events:auto;display:flex;gap:.8cqw;align-items:center}
.eline button{background:none;border:none;color:var(--cream);cursor:pointer;font-size:2.2cqw;padding:0;line-height:1}
.edit-paper{cursor:crosshair}
.pen{font-family:'Caveat',cursive;color:var(--red);font-weight:700}
.pen-in{font-family:'Caveat',cursive;font-size:1.35rem;color:var(--red);font-weight:700;background:transparent;border:none;border-bottom:1.5px dashed rgba(192,57,43,.35);outline:none;padding:2px 4px}
.pen-in:focus{border-bottom-color:var(--red);background:rgba(192,57,43,.04)}
.pen-in.mark{width:58px;text-align:center;font-size:1.6rem}
textarea.pen-in{width:100%;min-height:80px;border:1.5px dashed rgba(192,57,43,.35);border-radius:12px;padding:8px 10px;resize:vertical;line-height:1.25}
.qi{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--cream-2)}
.qi+.qi{margin-top:10px}.qi.sel{border-color:var(--green-3);background:#f1f7f3}
.ans{font-family:'Kalam',cursive;color:var(--blue);margin:4px 0}
.memo{font-size:.8rem;color:var(--muted)}
.grade-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.grade-layout>aside{position:sticky;top:84px}
@media(max-width:900px){.grade-layout{grid-template-columns:1fr}.grade-layout>aside{position:static}}
.total-line{font-size:1.6rem;margin:10px 0}
.spin{width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ink-wrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff}
.ink-wrap img{display:block;width:100%}
.ink-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tool.on,.lm.on{background:var(--green);color:var(--cream)}
.pens{display:inline-flex;align-items:center;gap:5px;margin:0 4px}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0;cursor:pointer}
.sw.on{box-shadow:0 0 0 2.5px var(--green)}
.swc{width:30px;height:28px;padding:0;border:none;background:none;cursor:pointer}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumb{width:84px;height:104px;border-radius:12px;object-fit:cover;border:1px solid var(--line);cursor:zoom-in;background:#fff;flex:none}
.thumb-wrap{position:relative}
.thumb-wrap button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:none;background:var(--red);color:#fff;cursor:pointer;font-size:12px}

/* register */
.seg{display:inline-flex;background:var(--cream-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:none;background:none;border-radius:9px;padding:6px 11px;font-weight:800;font-size:.8rem;cursor:pointer;color:var(--muted)}
.seg .P.on{background:var(--green);color:var(--cream)}.seg .L.on{background:var(--amber);color:#fff}.seg .A.on{background:var(--red);color:#fff}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:.7rem;color:var(--muted)}
.bar i{display:block;width:100%;max-width:34px;border-radius:9px 9px 4px 4px;background:var(--green-3)}
.meter{height:8px;background:#ece6d9;border-radius:99px;overflow:hidden;flex:1}
.meter i{display:block;height:100%;background:var(--green-3);border-radius:99px}
.meter.low i{background:var(--amber)}

/* overlays */
.overlay{position:fixed;inset:0;z-index:60}
.modal-bg{position:fixed;inset:0;background:rgba(6,30,23,.45);display:grid;place-items:center;padding:16px;z-index:70}
.modal{background:var(--card);border-radius:24px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto}
.lightbox{position:fixed;inset:0;background:rgba(6,30,23,.85);z-index:80;display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lightbox img{max-height:92vh;border-radius:12px}
#kiosk{background:var(--green);color:var(--cream);overflow:auto}
.kiosk-top{display:flex;justify-content:space-between;align-items:center;padding:18px 22px}
.kiosk-body{max-width:1000px;margin:auto;padding:10px 20px 40px;text-align:center}
.kiosk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:24px}
.kiosk-tile{background:rgba(245,240,230,.08);border:1.5px solid rgba(245,240,230,.18);border-radius:22px;padding:18px 12px;color:var(--cream);display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;font-weight:700}
.kiosk-tile:active{transform:scale(.96)}.kiosk-tile:hover{background:rgba(245,240,230,.14)}
.kiosk-tile .av{width:56px;height:56px;border-radius:18px;background:var(--cream);font-size:1.1rem}
.kiosk-tile.done{opacity:.6}
.kiosk-tile em{font-style:normal;font-size:.75rem;padding:3px 10px;border-radius:99px;background:var(--cream);color:var(--green)}
.kiosk-msg{background:var(--cream);color:var(--green);border-radius:20px;padding:16px;font-size:1.2rem;font-weight:700;margin-top:16px;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.95);opacity:0}}
#live{background:#062a20;color:var(--cream);display:flex;flex-direction:column}
.live-top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;gap:10px}
.live-dot{width:9px;height:9px;border-radius:50%;background:#ff5a4e;box-shadow:0 0 0 4px rgba(255,90,78,.25);display:inline-block}
.stage{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;padding:0 18px 12px;overflow:auto;align-content:center}
.tile{position:relative;aspect-ratio:4/3;background:#0d3a2e;border-radius:20px;overflow:hidden;border:2px solid transparent}
.tile.fac{border-color:#7fd1ae}
.tile video,.tile canvas{width:100%;height:100%;object-fit:cover;display:block}
.mirror{transform:scaleX(-1)}
.tile .tag{position:absolute;left:10px;bottom:10px;background:rgba(6,42,32,.75);padding:4px 10px;border-radius:99px;font-size:.8rem;font-weight:700}
.live-hint{grid-column:1/-1;text-align:center;opacity:.75;font-size:.9rem;padding:8px}
.live-ctrl{display:flex;justify-content:center;gap:10px;padding:12px 18px max(18px,env(safe-area-inset-bottom))}
.lc{width:54px;height:54px;border-radius:18px;border:none;background:rgba(245,240,230,.12);color:var(--cream);display:grid;place-items:center;cursor:pointer}
.lc.off{background:var(--red)}
.lc.leave{background:var(--red);width:auto;height:44px;padding:0 18px;font-weight:700;display:flex;gap:8px;align-items:center;border-radius:14px}
.fx{background:#0b382b;border-top:1px solid rgba(245,240,230,.1);padding:14px 18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid rgba(245,240,230,.25);background:transparent;color:var(--cream);border-radius:99px;padding:7px 14px;font-weight:700;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--cream);color:var(--green);border-color:var(--cream)}
.toggle{display:flex;align-items:center;gap:8px;font-size:.88rem;margin-top:12px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:90;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .2s;max-width:calc(100% - 30px);text-align:center}
[hidden]{display:none!important}
#print{display:none}
@media print{
  body{background:#fff}
  #app,#kiosk,#live,#modal,.toast{display:none!important}
  #print{display:block;font-family:Arial,sans-serif;color:#000}
  #print table{width:100%;border-collapse:collapse;font-size:10px}
  #print th,#print td{border:1px solid #444;padding:4px;text-align:center}
  #print td.n{text-align:left;white-space:nowrap}
  @page{size:landscape;margin:12mm}
}

/* --- Supabase edition additions --- */
.inkcv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.inkcv.draw{pointer-events:auto;cursor:crosshair;touch-action:none}
select.inp{appearance:auto}
.auth{max-width:520px;margin:auto;text-align:left}
.auth .card{padding:26px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.fgrid{grid-template-columns:1fr}}
.chipf{display:inline-flex;align-items:center;gap:6px;background:var(--mint);color:var(--green);border-radius:99px;padding:5px 12px;font-size:.82rem;font-weight:700;margin:3px}
.bookcard{cursor:pointer;transition:transform .15s}.bookcard:hover{transform:translateY(-3px)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px}
.pcard img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;font-weight:700;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--green);color:var(--cream);border-color:var(--green)}
.nodraw .inkcv.draw{pointer-events:none;touch-action:auto}
.ink-wrap canvas.inkcv:not(.draw){pointer-events:none;touch-action:auto;cursor:default}

</style>
</head>
<body>
<div id="app"></div>
<div id="kiosk" class="overlay" hidden></div>
<div id="live" class="overlay" hidden></div>
<div id="modal"></div>
<div id="print"></div>

function readImage(file,max=1400){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>loadImg(r.result).then(img=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8));}).catch(rej);r.readAsDataURL(file);});}
const isPdf=f=>f&&(f.type==='application/pdf'||/\.pdf$/i.test(f.name||''));
let pdfLibP=null;
function loadPdfJs(){
  if(pdfLibP)return pdfLibP;
  const base='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/';
  pdfLibP=(async()=>{
    await loadScript(base+'pdf.min.js');
    const lib=window.pdfjsLib;if(!lib)throw new Error('PDF reader did not load');
    const code=await (await fetch(base+'pdf.worker.min.js')).text();
    lib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
    return lib;
  })();
  pdfLibP.catch(()=>{pdfLibP=null;});
  return pdfLibP;
}
async function pdfToImages(file,max,limit=30){
  const lib=await loadPdfJs(),pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise,out=[],n=Math.min(pdf.numPages,limit);
  for(let i=1;i<=n;i++){
    const pg=await pdf.getPage(i),v0=pg.getViewport({scale:1}),s=Math.min(3,max/Math.max(v0.width,v0.height)),vp=pg.getViewport({scale:s});
    const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:x,viewport:vp}).promise;out.push(c.toDataURL('image/jpeg',.8));
  }
  if(pdf.numPages>limit)toast('Only the first '+limit+' pages of '+file.name+' were added.');
  return out;
}
async function readImages(files,max){
  const out=[];
  for(const f of files){
    if(isPdf(f)){
      const done=busy('Reading '+f.name+'…');
      try{out.push(...await pdfToImages(f,max));}catch(e){console.error(e);toast('Could not read '+f.name+' — try again, or upload photos of the pages instead.');}finally{done();}
      continue;
    }
    try{out.push(await readImage(f,max))}catch{toast('Could not read '+f.name+' — use a JPG, PNG or PDF file.')}
  }
  return out;
}

/* ---------- storage ---------- */
const URLS={};
const url=p=>{const e=URLS[p];return e&&e.exp>Date.now()?e.url:'';};
async function sign(paths){
  const need=[...new Set((paths||[]).filter(Boolean))].filter(p=>!url(p));
  for(let i=0;i<need.length;i+=100){
    const {data,error}=await sb.storage.from(BUCKET).createSignedUrls(need.slice(i,i+100),3600);
    if(error){console.warn('sign',error);continue;}
    (data||[]).forEach(r=>{if(r.signedUrl)URLS[r.path]={url:r.signedUrl,exp:Date.now()+50*60e3};});
  }
}
async function upload(path,src,type){
  const blob=typeof src==='string'?await (await fetch(src)).blob():src;
  const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:type||blob.type||'application/octet-stream',upsert:false});
  if(error)throw error;return path;
}
async function removeFiles(paths){const p=(paths||[]).filter(Boolean);if(p.length)await sb.storage.from(BUCKET).remove(p);}
const extOf=n=>((String(n).split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,8))||'bin';
async function urlToData(u){const b=await (await fetch(u)).blob();return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b);});}
async function download(path,name){
  if(!url(path))await sign([path]);
  const b=await (await fetch(url(path))).blob();
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}

/* ---------- data ---------- */
async function loadClasses(){
  const {data,error}=await sb.from('classes').select('*').order('created_at');
  if(error)throw error;D.classes=data||[];
  if(U.role==='learner')U.classId=U.me.class_id;
  else{const saved=localStorage.getItem('ct.classId');U.classId=((D.classes.find(c=>c.id===saved)||D.classes[0])||{}).id||null;}
  D.klass=D.classes.find(c=>c.id===U.classId)||null;
}
async function loadData(){
  const c=U.classId;if(!c)return;
  const q=(t,f)=>{const r=sb.from(t).select('*').eq('class_id',c);return f?f(r):r;};
  const since=localISO(addDays(new Date(),-150));
  const res=await Promise.all([
    q('learners',r=>r.order('surname').order('name')),
    q('assignments',r=>r.order('created_at',{ascending:false})),
    q('submissions'),
    q('results',r=>r.order('created_at',{ascending:false})),
    q('attendance',r=>r.gte('day',since)),
    isFac()?q('comments',r=>r.order('created_at',{ascending:false})):Promise.resolve({data:[]}),
    q('books',r=>r.order('created_at',{ascending:false})),
    q('book_pages',r=>r.order('page_no')),
    q('documents',r=>r.order('created_at',{ascending:false}))]);
  const bad=res.find(x=>x.error);if(bad)throw bad.error;
  const [lr,ar,sr,rr,atr,cr,br,pr,dr]=res;
  const att={};atr.data.forEach(a=>{(att[a.day]||(att[a.day]={}))[a.learner_id]=a.status;});
  Object.assign(D,{learners:lr.data,assignments:ar.data,subs:sr.data,results:rr.data,att,comments:cr.data||[],books:br.data,pages:pr.data,docs:dr.data});
  D.klass=D.classes.find(x=>x.id===c)||D.klass;
  await sign([...D.assignments.map(a=>a.sheet_path),...D.subs.flatMap(s=>s.scans||[]),...D.results.flatMap(r=>r.scans||[]),...D.pages.map(p=>p.path)]);
}

/* ---------- auth / session ---------- */
async function enterSession(){
  U.role=null;U.me=null;U.org='';
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return;
  if(session.user.is_anonymous){
    const {data:ls}=await sb.from('learner_sessions').select('learner_id').maybeSingle();
    if(!ls){T.authStep='learner';return;}
    const {data:l,error}=await sb.from('learners').select('*').eq('id',ls.learner_id).maybeSingle();
    if(error||!l){T.authStep='learner';return;}
    Object.assign(U,{role:'learner',me:l,classId:l.class_id,view:'home',param:null});return;
  }
  const getFac=()=>sb.from('facilitators').select('*, organizations(name)').eq('id',session.user.id).maybeSingle();
  let {data:f}=await getFac();
  if(!f&&T.pending){
    const {error}=await sb.rpc('register_facilitator',{p_code:T.pending.code,p_name:T.pending.name,p_surname:T.pending.surname});
    if(error){T.authMsg=error.message;T.authStep='facilitator';return;}
    localStorage.removeItem('ct.pending');T.pending=null;
    f=(await getFac()).data;
  }
  if(!f){T.authStep='facilitator';T.authMsg='Almost there — enter your details to finish signing up.';return;}
  Object.assign(U,{role:'facilitator',me:f,org:f.organizations?.name||'',view:'dash',param:null});
}
async function afterLogin(){
  T.loading=true;render();
  try{await enterSession();if(U.role){await loadClasses();await loadData();subscribeRealtime();}}
  catch(e){console.error(e);toast('Could not load your data: '+(e.message||e));}
  T.loading=false;render();
}
function subscribeRealtime(){
  if(rt){sb.removeChannel(rt);rt=null;}
  rt=sb.channel('db-changes').on('postgres_changes',{event:'*',schema:'public'},()=>{clearTimeout(rtTimer);rtTimer=setTimeout(softRefresh,700);}).subscribe();
}
let rt=null,rtTimer=null;
async function softRefresh(){
  if(!sb||!U.role||T.pendingSave||T.refreshing)return;
  T.refreshing=true;
  try{await loadData();}catch(e){T.refreshing=false;return;}
  T.refreshing=false;
  if(T.kiosk)renderKiosk();
  const a=document.activeElement,typing=a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName);
  if(T.mark||T.draft||typing||$('#live')&&!$('#live').hidden)return;
  render();
}
async function signOutAll(){
  if(typeof Live!=='undefined'&&Live.running)Live.leave();
  if(rt){sb.removeChannel(rt);rt=null;}
  try{await sb.auth.signOut();}catch{}
  Object.assign(U,{role:null,me:null,org:'',classId:null,view:'dash',param:null});resetD();
  Object.assign(T,{mark:null,draft:null,authStep:'role',matches:null,authMsg:'',kiosk:false});renderKiosk();render();
}

/* ---------- sample worksheet (rasterised to a JPEG so it uploads like a scan) ---------- */
function buildSample(){
  const W=800,H=1000,qs=[
    ['Which gas do plants absorb from the air during photosynthesis?',2,'carbon dioxide',1],
    ['Name the green pigment in leaves that captures sunlight.',2,'chlorophyll',1],
    ['Write the word equation for photosynthesis.',4,'carbon dioxide, water, sunlight, glucose, oxygen',2],
    ['Explain why photosynthesis is important for animals and people.',4,'oxygen, food, energy',3]];
  let y=300,body='';const questions=[],lines=[];
  qs.forEach(([t,m,memo,n],i)=>{
    const id='q'+(i+1);questions.push({id,num:i+1,marks:m,memo});
    body+=`<text x="70" y="${y}" font-size="19" fill="#1b1b1b">${i+1}. ${t}</text><text x="690" y="${y}" font-size="17" fill="#555" text-anchor="end">(${m})</text>`;
    let ly=y+52;
    for(let k=0;k<n;k++){body+=`<line x1="70" y1="${ly}" x2="690" y2="${ly}" stroke="#a9b3ad" stroke-width="1.4"/>`;lines.push({id:`l${i+1}${k}`,qid:id,x:+(70/W*100).toFixed(2),y:+(ly/H*100).toFixed(2),w:+(620/W*100).toFixed(2)});ly+=46;}
    y=ly-46+82;
  });
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Georgia, serif"><rect width="100%" height="100%" fill="#fffefa"/><line x1="712" y1="0" x2="712" y2="${H}" stroke="#e8a7a0" stroke-width="1.5"/><text x="70" y="70" font-size="14" fill="#0A4234" font-family="Arial" font-weight="bold" letter-spacing="2">CLASSTRACK · SAMPLE WORKSHEET</text><text x="70" y="112" font-size="30" font-weight="bold" fill="#111">Worksheet: Photosynthesis</text><text x="70" y="146" font-size="17" fill="#444">Natural Sciences · Answer every question on the lines provided.</text><text x="70" y="200" font-size="17" fill="#333">Name: ______________________________   Date: ______________</text><line x1="70" y1="232" x2="700" y2="232" stroke="#0A4234" stroke-width="2"/>${body}<text x="70" y="${H-40}" font-size="13" fill="#888">Total: 12 marks</text></svg>`;
  return {svg:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg),questions,lines};
}
async function sampleSheet(){
  const s=buildSample(),img=await loadImg(s.svg),c=document.createElement('canvas');c.width=1200;c.height=1500;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  return {data:c.toDataURL('image/jpeg',.9),questions:s.questions,lines:s.lines};
}

const scorePill=p=>{const v=pct(+p.score,+p.max);return `<span class="pill ${v<50?'red':v<70?'amber':''}">${+p.score}/${+p.max} · ${v}%</span>`;};

/* ---------- pen annotations ---------- */
const INK={tick:'<path d="M4 19c4 3 8 8 11 13 6-12 16-23 29-29"/>',half:'<path d="M4 19c4 3 8 8 11 13 6-12 16-23 29-29"/><path d="M21 9l11 16"/>',cross:'<path d="M8 6c8 7 18 16 30 26"/><path d="M38 5C28 13 18 22 9 31"/>'};
const inkSvg=k=>`<svg class="ink" viewBox="0 0 48 36">${INK[k]}</svg>`;
function paperHTML(a,answers={},items=null,editable=false,inkKey=null,draw=false){
  let h=`<div class="paper"><img src="${url(a.sheet_path)}" alt="${esc(a.title)}" draggable="false">`;
  for(const ln of a.lines){const v=answers[ln.id]||'',st=`left:${ln.x}%;top:${ln.y}%;width:${ln.w}%`;
    h+=editable?`<input class="ln" style="${st}" data-ln="${ln.id}" value="${esc(v)}" autocomplete="off" aria-label="Answer line">`:`<div class="ln" style="${st}">${esc(v)}</div>`;}
  if(items){let any=false;
    for(const q of a.questions){const it=items.find(i=>i.qid===q.id),qls=a.lines.filter(l=>l.qid===q.id);
      if(!it||it.mark==null||it.mark===''||!qls.length)continue;any=true;
      const last=qls[qls.length-1],x=Math.min(last.x+last.w+2,88),r=it.mark/it.max;
      h+=`<div class="anno" style="left:${x}%;top:${last.y}%">${inkSvg(r>=1?'tick':r>0?'half':'cross')}<span>${it.mark}</span></div>`;
      if(it.comment)h+=`<div class="anno-c" style="left:${qls[0].x+2}%;top:${last.y+1}%">${esc(it.comment)}</div>`;}
    if(any)h+=`<div class="anno-total"><svg viewBox="0 0 120 70" preserveAspectRatio="none"><path d="M64 6C28 3 5 17 7 36s30 29 58 28 50-13 48-32S86 2 50 9"/></svg><span>${sum(items,i=>i.mark)}/${sum(items,i=>i.max)}</span></div>`;}
  const li=answers&&answers.__ink;
  if(inkKey!=='mine'&&li&&li.mine&&li.mine.length){T.learnerInk=li;h+=`<canvas class="inkcv" data-ink="learner"></canvas>`;}
  if(inkKey)h+=`<canvas class="inkcv${draw?' draw':''}" data-ink="${inkKey}"></canvas>`;
  return h+'</div>';
}
const inkCtx=()=>T.mark?T.mark.ink:T.viewInk;
const PEN_COLS=['#c0392b','#1d4ed8','#15803d','#111827','#7e22ce','#ea580c','#db2777'];
const penBar=()=>`<span class="pens">${PEN_COLS.map(c=>`<button class="sw ${T.col===c?'on':''}" style="background:${c}" data-act="penCol" data-arg="${c}" title="Pen colour" aria-label="Pen colour ${c}"></button>`).join('')}<input class="swc" type="color" value="${T.col}" data-in="penCol" title="Any colour" aria-label="Choose any colour"></span>`;
function drawInk(cv,acts){
  const c=cv.getContext('2d'),w=cv.width,h=cv.height;c.clearRect(0,0,w,h);
  c.lineCap='round';c.lineJoin='round';
  for(const a of acts){
    const col=a.c||'#c0392b';c.strokeStyle=col;c.fillStyle=col;
    if(a.t==='a'){c.save();c.font=`700 ${Math.max(12,w*.036)}px Caveat, Kalam, cursive`;c.textBaseline='middle';String(a.s||'').split('\n').forEach((ln,i)=>c.fillText(ln,a.x*w,a.y*h+i*w*.04));c.restore();}
    else if(a.t==='s'){c.lineWidth=Math.max(1.8,w*.0042);c.beginPath();a.p.forEach(([x,y],i)=>i?c.lineTo(x*w,y*h):c.moveTo(x*w,y*h));if(a.p.length===1)c.lineTo(a.p[0][0]*w+.5,a.p[0][1]*h+.5);c.stroke();}
    else{c.save();c.translate(a.x*w,a.y*h);const k=w/560;c.scale(k,k);c.lineWidth=3.4;
      c.stroke(new Path2D(a.t==='k'?'M-18 0c3 3 7 8 10 13 6-12 15-23 27-30':'M-13 -13c7 7 17 16 26 26M13 -14C5 -6 -4 2 -12 12'));c.restore();}
  }
}
function setupInk(root=document){
  [...root.querySelectorAll('canvas[data-ink]')].forEach(cv=>{
    const key=cv.dataset.ink,src=inkCtx(),acts=key==='learner'?((T.learnerInk||{}).mine||[]):(src[key]||(src[key]=[])),draw=cv.classList.contains('draw'),host=cv.parentElement;
    const fit=()=>{const r=host.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));drawInk(cv,acts);};
    fit();if(window.ResizeObserver)new ResizeObserver(fit).observe(host);
    host.querySelectorAll('img').forEach(im=>{if(!im.complete)im.addEventListener('load',fit,{once:true});});
    if(!draw)return;
    let cur=null;const pt=e=>{const r=cv.getBoundingClientRect();return [+((e.clientX-r.left)/r.width).toFixed(4),+((e.clientY-r.top)/r.height).toFixed(4)];};
    cv.onpointerdown=e=>{e.preventDefault();const p=pt(e),tool=U.role==='learner'?'pen':T.tool;T.lastInk=key;
      if(tool==='text'){const s=prompt('Type your note — it will be placed where you tapped:');if(s&&s.trim()){acts.push({t:'a',x:p[0],y:p[1],s:s.trim(),c:T.col});drawInk(cv,acts);if(T.inkSaved)T.inkSaved();}return;}
      cv.setPointerCapture(e.pointerId);
      if(tool==='pen'){cur={t:'s',c:T.col,p:[p]};acts.push(cur);}else acts.push({t:tool==='tick'?'k':'x',c:T.col,x:p[0],y:p[1]});drawInk(cv,acts);};
    cv.onpointermove=e=>{if(!cur)return;cur.p.push(pt(e));drawInk(cv,acts);};
    cv.onpointerup=cv.onpointercancel=()=>{cur=null;if(T.inkSaved)T.inkSaved();};
  });
}
const redrawInk=()=>$$('canvas[data-ink]').forEach(cv=>{const k=cv.dataset.ink;drawInk(cv,k==='learner'?((T.learnerInk||{}).mine||[]):(inkCtx()[k]||[]));});
const cleanInk=ink=>Object.fromEntries(Object.entries(ink||{}).filter(([,v])=>v&&v.length));
async function flattenInk(src,acts){
  const ou=URL.createObjectURL(await (await fetch(src)).blob()),img=await loadImg(ou),c=document.createElement('canvas');URL.revokeObjectURL(ou);c.width=img.naturalWidth;c.height=img.naturalHeight;
  const x=c.getContext('2d');x.drawImage(img,0,0);
  if(acts&&acts.length){const k=document.createElement('canvas');k.width=c.width;k.height=c.height;drawInk(k,acts);x.drawImage(k,0,0);}
  return new Promise(r=>c.toBlob(r,'image/jpeg',.9));
}

/* ---------- AI fallback (keyword match against memo; used only if the ai-mark function is not deployed) ---------- */
const STOP=new Set('the a an and or of to in for is are be it on with by from that this as at its into which'.split(' '));
const kws=memo=>(memo.includes(',')?memo.split(','):memo.split(/\s+/)).map(s=>s.trim().toLowerCase().replace(/[^a-z0-9 ]/g,'')).filter(w=>w&&!STOP.has(w));
const hit=(a,k)=>a.includes(k)||(k.length>6&&a.includes(k.slice(0,-2)));
function localGrade(m){
  const items=m.items.map(it=>{const a=(it.answer||'').toLowerCase(),K=kws(it.memo||'');
    if(!K.length)return {id:it.key,mark:it.mark??0,comment:it.comment||''};
    const found=K.filter(k=>hit(a,k)),miss=K.filter(k=>!found.includes(k)),r=found.length/K.length;
    const comment=!a.trim()?'No answer — ask if you are stuck.':r>=1?['Excellent!','Spot on.','Well done.'][it.max%3]:r>0?`Good — also mention ${miss.slice(0,2).join(' & ')}.`:`Revise: the key idea is ${K.slice(0,2).join(' & ')}.`;
    return {id:it.key,mark:Math.round(r*it.max*2)/2,comment};});
  const p=pct(sum(items,i=>i.mark),sum(m.items,i=>i.max)),n=lname(m.learnerId).split(' ')[0];
  return {items,overall:p>=80?`Excellent work, ${n}! You clearly understand this topic.`:p>=50?`Good effort, ${n}. Look at the questions marked in red and add the missing key points.`:`${n}, let's revise this section together. Re-read your notes and try the marked questions again.`};
}
const parseRubric=t=>t.split('\n').map(s=>s.trim()).filter(Boolean).map((s,i)=>{const [d,m]=s.split('|');return {key:'c'+i,label:d.trim(),max:Math.max(.5,parseFloat(m)||1),mark:null,comment:'',memo:''};});
function parseRoster(t){
  return t.split(/\r?\n/).map(r=>r.split(/[,;\t]/).map(c=>c.replace(/^"|"$/g,'').trim()).filter(Boolean)).filter(c=>c.length)
    .map(c=>c.length>=2?{name:c[0],surname:c.slice(1).join(' ')}:(w=>({name:w[0],surname:w.slice(1).join(' ')}))(c[0].split(/\s+/)))
    .filter(x=>x.name&&x.surname&&!/^(name|names|first ?name)$/i.test(x.name));
}

async function addLearners(list){
  const have=new Set(D.learners.map(l=>(l.name.trim()+'|'+l.surname.trim()).toLowerCase())),rows=[];let dup=0;
  list.forEach(x=>{const k=(x.name+'|'+x.surname).toLowerCase();if(have.has(k)){dup++;return;}have.add(k);rows.push({class_id:U.classId,name:x.name,surname:x.surname});});
  if(rows.length){const {error}=await sb.from('learners').insert(rows);if(error)throw error;}

const A={
  /* ----- navigation & auth ----- */
  go:arg=>{const [v,p]=arg.split(':');go(v,p||null);},
  role:r=>{T.authStep=r;T.authMsg='';T.matches=null;render();},
  authBack:()=>{if(T.authStep==='facCode')T.authStep='facilitator';else if(T.matches)T.matches=null;else T.authStep='role';T.authMsg='';render();},
  facSend:async mode=>{
    const code=$('#f-code').value.trim(),name=$('#f-name').value.trim(),surname=$('#f-surname').value.trim(),email=$('#f-email').value.trim().toLowerCase();
    T.pending={code,name,surname,email};
    if(!code||!name||!surname||!/^\S+@\S+\.\S+$/.test(email)){T.authMsg='Please fill in the organisation code, your name, your surname and a valid email.';render();return;}
    const done=busy('Checking…');
    try{
      const {data:org,error}=await sb.rpc('check_org_code',{p_code:code});if(error)throw error;
      if(!org){T.authMsg='That organisation code was not recognised. Please check it with your organisation.';render();return;}
      localStorage.setItem('ct.pending',JSON.stringify(T.pending));
      const pw=($('#f-pass')||{}).value||'';
      if(mode!=='link'){
        if(!pw){T.authMsg='Please type a password. If you are new here, choose one now (8 or more characters) — you will use it every time you sign in.';render();return;}
        const {error:pe}=await sb.auth.signInWithPassword({email,password:pw});
        if(!pe){await afterLogin();return;}
        if(pw.length<8){T.authMsg='That password did not work. If you are new here, choose a password with at least 8 characters.';render();return;}
        const {data:su,error:se}=await sb.auth.signUp({email,password:pw});
        if(se){
          if(se.code==='user_already_exists'||/registered|already|exists/i.test(se.message||''))T.authMsg='That email already has an account, but the password does not match. Try again, or tap “Email me a sign-in link instead”.';
          else throw se;
          render();return;
        }
        if(!su.session){T.authMsg='Your account could not be opened straight away. Tap “Email me a sign-in link instead” and use the link in your email.';render();return;}
        await afterLogin();return;
      }
      const {data:{session}}=await sb.auth.getSession();
      if(session&&!session.user.is_anonymous&&(session.user.email||'').toLowerCase()===email){await afterLogin();return;}
      if(session)await sb.auth.signOut();
      const {error:e2}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true,emailRedirectTo:location.origin+location.pathname}});
      if(e2)throw e2;
      T.authStep='facCode';T.authMsg='';render();
    }finally{done();}
  },
  facVerify:async()=>{
    const token=$('#f-token').value.trim();if(!token)return toast('Enter the code from your email.');
    const done=busy('Signing in…');
    try{const {error}=await sb.auth.verifyOtp({email:T.pending.email,token,type:'email'});if(error)throw error;await afterLogin();}
    finally{done();}
  },
  learnerGo:async()=>{
    const name=$('#l-name').value.trim(),surname=$('#l-surname').value.trim();
    if(!name||!surname){T.authMsg='Please type both your name and your surname.';render();return;}
    const done=busy('Looking you up…');
    try{
      let {data:{session}}=await sb.auth.getSession();
      if(session&&!session.user.is_anonymous){await sb.auth.signOut();session=null;}
      if(!session){const {error}=await sb.auth.signInAnonymously();if(error)throw error;}
      const {data,error}=await sb.rpc('learner_lookup',{p_name:name,p_surname:surname});if(error)throw error;
      if(!data||!data.length){T.authMsg=`We couldn't find "${name} ${surname}". Check the spelling, or ask your facilitator to add you to the class.`;render();return;}
      if(data.length>1){T.matches=data;render();return;}
      await enterLearner(data[0].learner_id);
    }finally{done();}
  },
  learnerPick:async id=>{const done=busy('Entering class…');try{await enterLearner(id);}finally{done();}},
  logout:()=>{if(U.role==='facilitator'&&!confirm('Sign out of ClassTrack? You can sign back in with your password if you have set one — otherwise you will need a new email link.'))return;signOutAll();},
  settings:()=>{
    const m=U.me;
    modal(`<div class="row between"><h2 style="margin:0">Account</h2><button class="btn btn-ghost icon-btn" data-act="closeModal">${ic('x',18)}</button></div>
    <div class="list mt"><div class="li"><div class="grow"><div class="ttl">${esc(fullName(m))}</div><div class="small muted">${isFac()?esc(m.email)+' · '+esc(U.org):esc(D.klass?.name||'')}</div></div><span class="pill">${isFac()?'Facilitator':'Learner'}</span></div></div>
    ${isFac()?`<h3 class="mt" style="margin-bottom:4px">Password</h3><p class="small muted" style="margin:0 0 8px">Set a password so you can sign in on any device without waiting for an email.</p><input class="inp" id="set-pass" type="password" autocomplete="new-password" placeholder="New password (8+ characters)"><div class="row mt"><button class="btn btn-primary" data-act="setPass">Save password</button></div>`:''}
    <div class="row mt"><button class="btn btn-danger" data-act="logout">Sign out</button></div>`);
  },
  setPass:async()=>{
    const pw=($('#set-pass')||{}).value||'';
    if(pw.length<8){toast('Use at least 8 characters.');return;}
    const {error}=await sb.auth.updateUser({password:pw});if(error)throw error;
    $('#set-pass').value='';toast('Password saved. You can now sign in with your email and password.');
  },
  closeModal:()=>{$('#modal').innerHTML='';},

  zoom:(_,el)=>{$('#modal').innerHTML=`<div class="lightbox" data-act="closeModal"><img src="${el.src}" alt=""></div>`;},

  newClass:()=>modal(`<h2>New training class</h2><p class="muted">Give your training programme class a name. You can add learners right after.</p><label class="lbl">Class name</label><input class="inp" id="cls-name" placeholder="e.g. Level 4 Plumbing — Group A"><div class="row mt"><button class="btn btn-primary" data-act="saveClass">Create class</button><button class="btn btn-ghost" data-act="closeModal">Cancel</button></div>`),
  saveClass:async()=>{

  },
  renameClass:()=>modal(`<h2>Rename class</h2><label class="lbl">Class name</label><input class="inp" id="cls-name" value="${esc(D.klass.name)}"><div class="row mt"><button class="btn btn-primary" data-act="saveRename">Save</button><button class="btn btn-ghost" data-act="closeModal">Cancel</button></div>`),
  saveRename:async()=>{const name=$('#cls-name').value.trim();if(!name)return;const {error}=await sb.from('classes').update({name}).eq('id',U.classId);if(error)throw error;D.klass.name=name;A.closeModal();render();},
  delClass:async()=>{
    if(!confirm(`Delete "${D.klass.name}" and ALL its learners, marks, attendance and books? This cannot be undone.`))return;
    const {error}=await sb.from('classes').delete().eq('id',U.classId);if(error)throw error;
    D.classes=D.classes.filter(c=>c.id!==U.classId);const next=D.classes[0];
    if(next)await setClass(next.id);else{U.classId=null;D.klass=null;resetD();render();}
  },

  /* ----- register ----- */
  regDate:v=>{T.regDate=v||localISO();render();},
  cutoff:async v=>{const t=v||'08:00';const {error}=await sb.from('classes').update({late_after:t}).eq('id',U.classId);if(error)throw error;D.klass.late_after=t;toast('Late time saved');},
  setAtt:async arg=>{
    const [id,k]=arg.split('|'),day=T.regDate,rec=D.att[day]||(D.att[day]={}),cur=rec[id];
    if(cur===k)delete rec[id];else rec[id]=k;render();
    const r=cur===k?await sb.from('attendance').delete().eq('learner_id',id).eq('day',day)
      :await sb.from('attendance').upsert({class_id:U.classId,learner_id:id,day,status:k},{onConflict:'learner_id,day'});
    if(r.error){toast('Could not save: '+r.error.message);await reload();}
  },
  allPresent:async()=>{
    const day=T.regDate,rec=D.att[day]||(D.att[day]={}),rows=D.learners.filter(l=>!rec[l.id]).map(l=>({class_id:U.classId,learner_id:l.id,day,status:'P'}));

  },
  addLearner:async()=>{const name=$('#new-name').value.trim(),surname=$('#new-surname').value.trim();if(!name||!surname)return toast('Enter both a name and a surname.');await addLearners([{name,surname}]);},

  importFile:async files=>{if(!files[0])return;const list=parseRoster(await files[0].text());if(!list.length)return toast('No names found in that file.');await addLearners(list);},
  delLearner:async id=>{

    const {error}=await sb.from('learners').delete().eq('id',id);if(error)throw error;await loadData();render();

  printReg:()=>{

  aiSuggest:async()=>{
    const m=T.mark;if(m.src==='scan'&&!m.scans.length)return toast("Add the learner's pages first.");
    m.loading=true;render();
    try{
      const images=[];
      (m.memoImgs||[]).forEach((d,i)=>images.push({label:`Memorandum / rubric page ${i+1}`,data:d}));
      if(m.src==='scan')m.scans.forEach((d,i)=>images.push({label:`Learner's work, page ${i+1}`,data:d}));
      else for(const [i,p] of m.scanPaths.entries())images.push({label:`Learner's scanned page ${i+1}`,data:await urlToData(url(p))});
      const body={title:m.title,items:m.items.map(({key,label,max,memo,answer,qid})=>({key,label:qid?'Question '+label:label,max,memo,answer})),images};
      const {data,error}=await sb.functions.invoke('ai-mark',{body});
      let r=data;
      if(error||!data||data.error){
        if(m.src==='submission'){r=localGrade(m);toast('AI service is not set up yet — used a simple keyword match instead.');}
        else throw new Error((data&&data.error)||'AI marking is not set up yet (see SETUP.md). You can still mark with the red pen.');
      }else toast('Suggestions ready — review, adjust and approve.');
      m.items.forEach(it=>{const s=(r.items||[]).find(x=>x.id===it.key);if(s){it.mark=Math.max(0,Math.min(it.max,Math.round((+s.mark||0)*2)/2));it.comment=s.comment||'';}});
      m.overall=r.overall||m.overall;
    }catch(e){handleErr(e);}
    m.loading=false;if(T.mark===m)render();
  },
  gApprove:async()=>{
    const m=T.mark;
    if(m.src==='scan'&&!m.scans.length&&!confirm('No learner pages attached. Save the marks only?'))return;
    if(m.items.some(i=>i.mark==null)&&!confirm('Some items have no mark yet and will count as 0. Approve anyway?'))return;
    const done=busy('Saving to portfolio…');
    try{
      let scans=m.scanPaths||[];
      if(m.src==='scan'){scans=[];for(const d of m.scans){const p=`${U.classId}/private/${m.learnerId}/scans/${uid()}.jpg`;await upload(p,d,'image/jpeg');scans.push(p);}}
      const row={class_id:U.classId,learner_id:m.learnerId,title:(m.title||'Assessment').trim(),score:sum(m.items,i=>i.mark),max:sum(m.items,i=>i.max),feedback:(m.overall||'').trim(),
        items:m.items.map(i=>({qid:i.qid||null,label:i.label,max:i.max,mark:i.mark??0,comment:i.comment,answer:i.answer??null})),scans,ink:cleanInk(m.ink),source:m.src,assignment_id:m.assignmentId||null,submission_id:m.subId||null};
      const {error}=await sb.from('results').insert(row);if(error)throw error;
      if(m.subId){const {error:e2}=await sb.from('submissions').update({status:'marked'}).eq('id',m.subId);if(e2)throw e2;}
      const who=lname(m.learnerId).split(' ')[0];T.mark=null;await loadData();render();toast(`Approved and saved to ${who}'s portfolio ✓`);
    }finally{done();}
  },

  liveMic:()=>{Live.micOn=!Live.micOn;Live.raw?.getAudioTracks().forEach(t=>t.enabled=Live.micOn);$('#lc-mic').classList.toggle('off',!Live.micOn);},
  liveCam:()=>{Live.camOn=!Live.camOn;$('#lc-cam').classList.toggle('off',!Live.camOn);},
  liveFxPanel:()=>{const f=$('#live-fx');f.hidden=!f.hidden;Live.renderFx();},
  liveFx:k=>Live.setEffect(k),
  liveChroma:(_,el)=>{Live.chroma=el.checked;if(!Live.chroma&&Live.effect!=='none')Live.loadSeg();Live.renderFx();},
  liveBgFile:async f=>{const [d]=await readImages(f.slice(0,1),1280);if(!d)return;Live.customBg=await loadImg(d);Live.setEffect('uploaded');}
};
Object.keys(A).forEach(k=>{const f=A[k];A[k]=function(...a){try{const r=f.apply(this,a);if(r&&r.catch)r.catch(handleErr);return r;}catch(e){handleErr(e);}};});

/* ---------- event delegation ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  if(el.tagName==='A')e.preventDefault();
  const f=A[el.dataset.act];if(f)f(el.dataset.arg??'',el,e);
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.in&&A[el.dataset.in])A[el.dataset.in](el.value,el);
  else if(el.dataset.ln)A.answer(el.value,el);
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.file&&A[el.dataset.file]){const files=[...el.files];A[el.dataset.file](files,el);el.value='';}
  if(el.dataset.ch&&A[el.dataset.ch])A[el.dataset.ch](el.value,el);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').innerHTML)A.closeModal();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)softRefresh();});

T.inkSaved=()=>{
  if(U.role!=='learner'||U.view!=='doWork')return;
  const aid=U.param,s0=mySub(aid);if(s0&&s0.status!=='draft')return;
  const s=ensureSubLocal(aid);s.answers.__ink=T.viewInk;T.pendingSave=1;
  clearTimeout(T.st);T.st=setTimeout(()=>saveDraft(aid).catch(handleErr),700);const e=$('#save-state');if(e)e.textContent='Saving…';
};

/* ---------- start ---------- */
(async function init(){
  if(!configured){T.loading=false;render();return;}
  await afterLogin();
  setInterval(()=>{if(!document.hidden)softRefresh();},45000);
})();

/* ================= LIVE CLASS ================= */
const BGS={};
function makeBg(kind){
  const c=document.createElement('canvas');c.width=640;c.height=480;const x=c.getContext('2d');
  if(kind==='forest'){const g=x.createLinearGradient(0,0,640,480);g.addColorStop(0,'#0A4234');g.addColorStop(1,'#2a7a5c');x.fillStyle=g;x.fillRect(0,0,640,480);x.fillStyle='rgba(245,240,230,.07)';[[90,80,70],[560,120,110],[480,420,90],[150,400,50]].forEach(([a,b,r])=>{x.beginPath();x.arc(a,b,r,0,7);x.fill();});}
  else if(kind==='classroom'){x.fillStyle='#e9dfc9';x.fillRect(0,0,640,480);x.fillStyle='#7a5530';x.fillRect(60,50,520,280);x.fillStyle='#1d4a3a';x.fillRect(72,62,496,256);x.fillStyle='rgba(255,255,255,.85)';x.font='italic 30px Georgia';x.fillText("Today's lesson",100,120);x.font='22px Georgia';x.fillText('CO₂ + H₂O + light → glucose + O₂',100,170);x.fillStyle='#c9b48f';x.fillRect(0,400,640,80);}
  else{x.fillStyle='#F5F0E6';x.fillRect(0,0,640,480);x.fillStyle='#e0ece4';x.beginPath();x.arc(530,90,170,0,7);x.fill();x.fillStyle='#0A4234';x.font='700 26px "Plus Jakarta Sans",sans-serif';x.fillText('ClassTrack',30,450);}
  return c;
}
function makeSignal(onMsg){
  const ch=sb.channel('live-'+U.classId,{config:{broadcast:{self:false}}});
  let ready=false;const q=[];
  const raw=m=>ch.send({type:'broadcast',event:'sig',payload:m});
  ch.on('broadcast',{event:'sig'},({payload})=>onMsg(payload)).subscribe(st=>{if(st==='SUBSCRIBED'){ready=true;q.splice(0).forEach(raw);}});
  return {send:m=>ready?raw(m):q.push(m),close:()=>sb.removeChannel(ch)};
}
const Live={
  open(){
    if(this.running)return;const el=$('#live');el.hidden=false;
    this.id=uid();this.role=U.role;this.name=myName();
    Object.assign(this,{peers:{},effect:'none',bgKey:'none',chroma:false,bgCanvas:null,micOn:true,camOn:true});
    el.innerHTML=`<div class="live-top"><div class="row"><span class="live-dot"></span><b>Live class</b><span class="pill" id="live-count" style="background:rgba(245,240,230,.12);color:var(--cream)">1 in class</span></div><button class="lc leave" data-act="liveLeave">${ic('x',18)}Leave</button></div>
    <div class="stage" id="live-stage"><div class="tile ${this.role==='facilitator'?'fac':''}"><canvas id="live-self" class="mirror"></canvas><span class="tag">You${this.role==='facilitator'?' · Facilitator':''}</span></div>
    <div class="live-hint" id="live-hint">Waiting for others in your class to join…</div></div>
    <div class="fx" id="live-fx" hidden></div>
    <div class="live-ctrl"><button class="lc" id="lc-mic" data-act="liveMic" title="Microphone">${ic('mic',22)}</button><button class="lc" id="lc-cam" data-act="liveCam" title="Camera">${ic('video',22)}</button><button class="lc" data-act="liveFxPanel" title="Background / green screen">${ic('image',22)}</button></div>`;
    this.start().catch(err=>{const h=$('#live-hint');if(h)h.innerHTML=`<b>Camera unavailable:</b> ${esc(err.message)}<br>Allow camera access and open ClassTrack via http://localhost or https.`;});
  },
  async start(){
    if(!navigator.mediaDevices?.getUserMedia)throw new Error('This page is not in a secure context (use https or localhost).');
    this.raw=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480},facingMode:'user'},audio:{echoCancellation:true,noiseSuppression:true}});
    const v=this.video=document.createElement('video');v.muted=true;v.playsInline=true;v.srcObject=this.raw;await v.play();
    const c=this.canvas=$('#live-self');c.width=v.videoWidth||640;c.height=v.videoHeight||480;this.ctx=c.getContext('2d');
    this.tmp=document.createElement('canvas');this.tmp.width=c.width;this.tmp.height=c.height;this.tctx=this.tmp.getContext('2d',{willReadFrequently:true});
    this.small=document.createElement('canvas');this.small.width=48;this.small.height=36;
    this.running=true;this.loop();
    this.out=c.captureStream(24);this.raw.getAudioTracks().forEach(t=>this.out.addTrack(t));
    this.sig=makeSignal(m=>this.onMsg(m));this.send({type:'join',name:this.name,role:this.role});
  },
  async loop(){while(this.running){await this.frame();await new Promise(r=>requestAnimationFrame(r));}},
  async frame(){
    const {ctx,canvas:c,video:v}=this,w=c.width,h=c.height;
    if(!this.camOn){ctx.fillStyle='#0d3a2e';ctx.fillRect(0,0,w,h);ctx.fillStyle='#F5F0E6';ctx.font='700 72px "Plus Jakarta Sans",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(initials(this.name),w/2,h/2);ctx.textAlign='start';ctx.textBaseline='alphabetic';return;}
    if(this.effect==='none'){ctx.drawImage(v,0,0,w,h);return;}
    if(this.effect==='image'&&this.chroma){this.chromaKey();return;}
    if(!this.seg){ctx.drawImage(v,0,0,w,h);return;}
    try{await this.seg.send({image:v});}catch{ctx.drawImage(v,0,0,w,h);}
  },
  composite(r){ // AI person segmentation (MediaPipe)
    const {ctx}=this,w=this.canvas.width,h=this.canvas.height;
    ctx.save();ctx.clearRect(0,0,w,h);ctx.drawImage(r.segmentationMask,0,0,w,h);
    ctx.globalCompositeOperation='source-in';ctx.drawImage(r.image,0,0,w,h);
    ctx.globalCompositeOperation='destination-over';
    if(this.effect==='blur'){this.small.getContext('2d').drawImage(r.image,0,0,48,36);ctx.imageSmoothingEnabled=true;ctx.drawImage(this.small,0,0,w,h);}else this.drawBg(ctx,w,h);
    ctx.restore();
  },
  chromaKey(){ // physical green screen
    const {tctx,tmp,ctx}=this,w=tmp.width,h=tmp.height;tctx.drawImage(this.video,0,0,w,h);
    const d=tctx.getImageData(0,0,w,h),p=d.data;
    for(let i=0;i<p.length;i+=4){const r=p[i],g=p[i+1],b=p[i+2];if(g>80&&g>r*1.25&&g>b*1.25)p[i+3]=0;else if(g>r*1.1&&g>b*1.1)p[i+1]=Math.max(r,b);}
    tctx.putImageData(d,0,0);ctx.clearRect(0,0,w,h);this.drawBg(ctx,w,h);ctx.drawImage(tmp,0,0);
  },
  drawBg(ctx,w,h){const b=this.bgCanvas;if(!b){ctx.fillStyle='#0A4234';ctx.fillRect(0,0,w,h);return;}const bw=b.naturalWidth||b.width,bh=b.naturalHeight||b.height,s=Math.max(w/bw,h/bh);ctx.drawImage(b,(w-bw*s)/2,(h-bh*s)/2,bw*s,bh*s);},
  async loadSeg(){
    if(this.seg||this.segLoading)return;this.segLoading=true;this.renderFx();
    try{const base='https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/';await loadScript(base+'selfie_segmentation.js');
      const s=new SelfieSegmentation({locateFile:f=>base+f});s.setOptions({modelSelection:1});s.onResults(r=>this.composite(r));if(s.initialize)await s.initialize();this.seg=s;}
    catch(e){this.chroma=true;toast('Could not load the AI background model (offline?). Switched to green-screen mode.');}
    this.segLoading=false;this.renderFx();
  },
  async setEffect(k){
    if(k==='custom'){$('#bg-file')?.click();return;}
    this.bgKey=k;this.effect=k==='none'||k==='blur'?k:'image';
    if(this.effect==='image')this.bgCanvas=k==='uploaded'?this.customBg:(BGS[k]||(BGS[k]=makeBg(k)));
    this.renderFx();if(this.effect==='blur'||(this.effect==='image'&&!this.chroma))await this.loadSeg();
  },
  renderFx(){
    const f=$('#live-fx');if(!f)return;const fx=[['none','None'],['blur','Blur'],['forest','Forest green'],['classroom','Classroom'],['cream','Cream studio'],['custom','Upload image…']];
    f.innerHTML=`<div class="row between" style="margin-bottom:10px"><b>Virtual background</b><span class="small" style="opacity:.7">${this.segLoading?'Loading AI model…':this.chroma?'Green-screen (chroma key) mode':'AI person detection'}</span></div>
    <div class="chips">${fx.map(([k,l])=>`<button class="chip ${this.bgKey===k||(k==='custom'&&this.bgKey==='uploaded')?'on':''}" data-act="liveFx" data-arg="${k}">${l}</button>`).join('')}</div>
    <label class="toggle"><input type="checkbox" data-ch="liveChroma" ${this.chroma?'checked':''}> I'm in front of a real green screen (faster, no AI needed)</label>
    <input type="file" accept="image/*" id="bg-file" hidden data-file="liveBgFile">`;
  },
  send(m){m.from=this.id;this.sig?.send(m);},
  peer(id,name,role){
    if(this.peers[id])return this.peers[id];
    const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]}),p=this.peers[id]={pc,name,role,q:[]};
    this.out.getTracks().forEach(t=>pc.addTrack(t,this.out));
    pc.onicecandidate=e=>{if(e.candidate)this.send({type:'ice',to:id,c:e.candidate.toJSON()});};
    pc.ontrack=e=>this.showRemote(id,e.streams[0]);
    pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState))this.drop(id);};
    return p;
  },
  async setRemote(p,sdp){await p.pc.setRemoteDescription(sdp);for(const c of p.q.splice(0))await p.pc.addIceCandidate(c).catch(()=>{});},
  async onMsg(m){
    if(!this.running||m.from===this.id||(m.to&&m.to!==this.id))return;
    try{
      if(m.type==='join'){if(this.peers[m.from])this.drop(m.from);const p=this.peer(m.from,m.name,m.role);await p.pc.setLocalDescription(await p.pc.createOffer());this.send({type:'offer',to:m.from,sdp:{type:'offer',sdp:p.pc.localDescription.sdp},name:this.name,role:this.role});}
      else if(m.type==='offer'){let p=this.peers[m.from];if(p&&p.pc.signalingState!=='stable'){if(this.id>m.from)return;await p.pc.setLocalDescription({type:'rollback'});}p=p||this.peer(m.from,m.name,m.role);await this.setRemote(p,m.sdp);await p.pc.setLocalDescription(await p.pc.createAnswer());this.send({type:'answer',to:m.from,sdp:{type:'answer',sdp:p.pc.localDescription.sdp}});}
      else if(m.type==='answer'){const p=this.peers[m.from];if(p&&p.pc.signalingState==='have-local-offer')await this.setRemote(p,m.sdp);}
      else if(m.type==='ice'){const p=this.peers[m.from];if(!p)return;p.pc.remoteDescription?await p.pc.addIceCandidate(m.c).catch(()=>{}):p.q.push(m.c);}
      else if(m.type==='leave')this.drop(m.from);
    }catch(e){console.warn('live',e);}
  },
  showRemote(id,stream){
    const p=this.peers[id];if(!p)return;p.stream=stream;let t=$('#tile-'+id);
    if(!t){t=document.createElement('div');t.className='tile'+(p.role==='facilitator'?' fac':'');t.id='tile-'+id;t.innerHTML=`<video autoplay playsinline></video><span class="tag">${esc(p.name)}${p.role==='facilitator'?' · Facilitator':''}</span>`;const st=$('#live-stage');p.role==='facilitator'?st.prepend(t):st.insertBefore(t,$('#live-hint'));}
    const v=t.querySelector('video');if(v.srcObject!==stream){v.srcObject=stream;v.play().catch(()=>{});}this.updateCount();
  },
  drop(id){const p=this.peers[id];if(!p)return;try{p.pc.close()}catch{}delete this.peers[id];$('#tile-'+id)?.remove();this.updateCount();},
  updateCount(){const n=Object.values(this.peers).filter(p=>p.stream).length+1;const c=$('#live-count');if(c)c.textContent=`${n} in class`;const h=$('#live-hint');if(h)h.hidden=n>1;},
  leave(){
    if(this.running)this.send({type:'leave'});Object.keys(this.peers||{}).forEach(id=>this.drop(id));this.running=false;
    this.raw?.getTracks().forEach(t=>t.stop());this.out?.getTracks().forEach(t=>t.stop());this.sig?.close();this.sig=null;this.raw=null;
    const el=$('#live');el.hidden=true;el.innerHTML='';
  }
};
window.addEventListener('beforeunload',()=>{if(Live.running)Live.send({type:'leave'});});
